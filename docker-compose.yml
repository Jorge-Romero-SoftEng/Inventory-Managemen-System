name: ${PROJECT_NAME}-security

services:
  migration:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}?schema=public
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - security_net

  db:
    image: postgres:16-alpine
    platform: linux/amd64
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: ${POSTGRES_HOST_AUTH_METHOD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - security_net

  app:
    build:
      context: .
      target: runner
    image: ${APP_IMAGE_NAME}-security:${APP_IMAGE_TAG}
    pull_policy: never
    container_name: ${PROJECT_NAME}-app-security
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_LOCALE: ${NEXT_PUBLIC_LOCALE}
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://app/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - security_net

# If you prefer mapping out specific infrastructure, CMS, and advanced security header checks while avoiding aggressive password brute-forcing, expand your list with these exact modules
# -m
# - port_scan,http_status_scan,dir_scan,admin_scan,clickjacking_vuln,content_security_policy_vuln,content_type_options_vuln,http_options_enabled_vuln,server_version_vuln,http_cookie_vuln,subdomain_scan,wappalyzer_scan,cms_detection_scan,pma_scan,wordpress_version_scan,wp_plugin_scan,joomla_version_scan,drupal_version_scan,ssl_expiring_certificate_scan,cors_vuln,heartbleed_vuln
# - all

  nettacker:
    image: owasp/nettacker:latest
    platform: linux/amd64
    pull_policy: if_not_present
    container_name: ${PROJECT_NAME}-nettacker
    restart: "no"
    entrypoint: ["poetry", "run", "python3", "./nettacker.py"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./security-reports:/reports
    command:
      - -i
      - http://app
      - -m
      - all
      - -x
      - ftp_brute,ssh_brute,http_form_brute,smtp_brute,smb_brute,telnet_brute,vnc_brute,all_brute
      - -o
      - /reports/app_security.html
      - -d
      - -t
      - "5"
      - -M
      - "5"
      - --set-hardware-usage
      - low
      - -v
    networks:
      - security_net

networks:
  security_net:
    name: ${PROJECT_NAME}-security-net
    driver: bridge
    internal: true

volumes:
  pgdata:
