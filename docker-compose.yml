services:
  db:
    image: postgres:16-alpine
    pull_policy: if_not_present
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wholesale_pos
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wholesale_pos"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wholesale_pos?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
